id: AR-POST-006
title: Expired Entra client secret fails the post before any Dynamics data call
tags: [posting, msd, auth, negative]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
  rows:
    receipts:
      - {id: 1, receipt_no: R-0106, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: matched}
    allocations:
      - {receipt_id: 1, invoice_id: 1, amount: 1000}
  erp_stubs:
    - file: ../../wiremock-d365/stubs/entra_token_invalid_client.json
when:
  - request: {method: POST, path: /receipts/1/post}
    expect: {status: 502}
then:
  db:
    receipts: {rows: [{receipt_no: R-0106, status: post_failed, post_error: "{{contains:token request failed}}"}]}
  erp_requests:
    - {url_path_pattern: "^/data/", count: 0}
    - {url_path_pattern: "^/api/services/", count: 0}
