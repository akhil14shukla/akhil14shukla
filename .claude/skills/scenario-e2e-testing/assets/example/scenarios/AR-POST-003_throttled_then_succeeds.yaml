id: AR-POST-003
title: Dynamics throttles once (429 + Retry-After); the app retries and posts exactly once
tags: [posting, msd, resilience, throttling]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
  rows:
    receipts:
      - {id: 1, receipt_no: R-0103, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: matched}
    allocations:
      - {receipt_id: 1, invoice_id: 1, amount: 1000}
  erp_stubs:
    - file: ../../wiremock-d365/stubs/fo_header_throttled_once.json
when:
  - request: {method: POST, path: /receipts/1/post}
    expect: {status: 200, json: {status: posted}}
then:
  db:
    receipts: {rows: [{receipt_no: R-0103, status: posted, msd_voucher: VCH-000001}]}
  erp_requests:
    - {method: POST, url_path: /data/CustomerPaymentJournalHeaders, count: 2}
    - {method: POST, url_path: /api/services/ARIntegrationServices/ARPostingService/postJournal, count: 1}
