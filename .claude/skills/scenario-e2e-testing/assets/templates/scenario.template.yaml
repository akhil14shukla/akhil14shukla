# Annotated scenario template: every key the runner understands, once.
# Copy, delete what you do not need, and keep one business rule per file.
# File name: <ID>_<rule_in_snake_case>.yaml, e.g. AR-POST-004_line_rejected_by_dynamics.yaml

id: AR-AREA-NNN                 # unique, stable, never reused; appears in CI output and JUnit
title: <condition> → <observable outcome>   # a sentence a finance user would recognise as the rule
tags: [matching, msd, negative] # used by --filter; tag the incident/ticket too, e.g. INC-2291
# skip: "reason + ticket"       # temporarily excluded; skipped scenarios are listed, never silent
clock: 2026-03-20T09:00:00Z     # the app's 'now' for this scenario (needs the app's clock hook)

given:
  # Shared fixture files, run in order, relative to this file. Prefer them for row
  # graphs several scenarios share; inline rows for what this scenario is about.
  sql: [../fixtures/two_open_invoices_c001.sql]
  # Inline rows, inserted in the order written (parents before children).
  # Values: strings, numbers, null, dates, nested objects/lists (stored as jsonb).
  rows:
    receipts:
      - {id: 1, receipt_no: R-0101, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: matched}
  # How Dynamics behaves for this scenario. Default happy-path mappings are loaded
  # by WireMock at boot (priority 10); these override them (use priority 1).
  erp_stubs:
    - file: ../../wiremock-d365/stubs/fo_header_throttled_once.json
    - inline:
        priority: 1
        request: {method: POST, urlPath: /data/CustomerPaymentJournalLines}
        response: {status: 400, jsonBody: {error: {code: "", message: "Exact message copied from production logs"}}}

when:
  # Steps run in order; the first failing step stops the scenario.
  - name: record receipt                        # optional; shown in failure messages
    request:
      method: POST
      path: /receipts
      headers: {X-Correlation-Id: "{{scenario_id}}"}
      json: {receipt_no: R-0102, amount: "300.00"}
      # query: {dryRun: "false"}
      # timeout_s: 30
    expect:
      status: 201
      json: {status: unmatched}                 # subset match: unlisted keys are ignored
      # body_contains: "..."
    save: {receipt_id: $.id}                    # later steps and `then` can use {{receipt_id}}

  - request: {method: POST, path: "/receipts/{{receipt_id}}/post"}
    expect: {status: 200}

  # Background work: poll SQL until the value matches (or call a test hook that runs the job now).
  - wait_for: {sql: "SELECT status FROM receipts WHERE id = {{receipt_id}}", equals: posted, timeout_s: 15}

  # Change the world mid-scenario: e.g. Dynamics recovers, or another user edits a row.
  - erp_stubs: [{file: ../../wiremock-d365/stubs/fo_post_service_unavailable.json}]
  - sql: "UPDATE invoices SET status = 'disputed' WHERE invoice_no = 'INV-1002'"
  - set: {expected_voucher: VCH-000001}

then:
  db:
    receipts:
      # mode: exact (default) — these rows and no others (where-filtered); order-insensitive
      # mode: contains — these rows exist, others may too
      # mode: absent — no row matches any of these
      where: "receipt_no = 'R-0102'"            # optional SQL filter
      # order_by: id                            # makes the comparison ordered
      # count: 1                                # row count, with or without rows
      rows:
        - {status: posted, unapplied_amount: 0, msd_voucher: "{{expected_voucher}}", posted_at: "{{iso_datetime}}"}
    allocations: {count: 1}
  db_unchanged: [customers, invoices]           # full-table before/after comparison (ignore_columns applied)
  erp_requests:                                 # what the app sent to Dynamics
    - {method: POST, url_path: /data/CustomerPaymentJournalLines, count: 1, json: {CreditAmount: 300, MarkedInvoice: INV-1002}}
    - {url_path_pattern: "/postJournal$", count: 0}
    # - {method: POST, url_path: /data/X, body_contains: "R-0102"}   # no count = at least one
  erp_sequence: [POST /data/CustomerPaymentJournalHeaders, POST /data/CustomerPaymentJournalLines]
  # erp_unmatched: allow                        # default 'none': any call no stub covers fails the scenario

# Matchers usable anywhere an expected value goes:
#   "{{any}}" "{{not_null}}" "{{uuid}}" "{{iso_datetime}}"
#   "{{regex:^VCH-\\d+$}}" "{{contains:on hold}}" "{{gt:0}}" "{{lt:100.01}}"
# Numbers compare as decimals (1000 == "1000.00"); timestamps compare as instants.
