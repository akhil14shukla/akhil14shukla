id: AR-VAL-003
title: Posting an already-posted receipt is refused and never creates a second journal in Dynamics
tags: [validation, idempotency, msd]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
  rows:
    receipts:
      - {id: 1, receipt_no: R-0203, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: posted, msd_journal: CPJ-000777, msd_voucher: VCH-000777}
when:
  - request: {method: POST, path: /receipts/1/post}
    expect: {status: 409, json: {voucher: VCH-000777}}
then:
  db_unchanged: [receipts]
  mock_requests:
    - {url_path_pattern: ".*", count: 0}
