id: AR-MATCH-003
title: Overpayment pays the invoice and leaves the excess unapplied
tags: [matching, overpayment]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
when:
  - request:
      method: POST
      path: /receipts
      json: {receipt_no: R-0003, customer_no: C001, currency: USD, amount: "300.00", reference: "INV-1002", received_on: 2026-03-19}
    expect: {status: 201}
    save: {receipt_id: $.id}
  - request: {method: POST, path: "/receipts/{{receipt_id}}/match"}
    expect: {status: 200, json: {status: partially_matched, unapplied_amount: "50.00"}}
then:
  db:
    receipts: {rows: [{receipt_no: R-0003, status: partially_matched, unapplied_amount: 50}]}
    invoices:
      mode: contains
      rows: [{invoice_no: INV-1002, open_amount: 0, status: paid}]
    allocations: {rows: [{amount: 250}]}
