id: AR-POST-004
title: Dynamics rejects a journal line; receipt is marked post_failed with the D365 message and the journal is never posted
tags: [posting, msd, negative]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
  rows:
    receipts:
      - {id: 1, receipt_no: R-0104, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: matched}
    allocations:
      - {receipt_id: 1, invoice_id: 1, amount: 1000}
  mock_stubs:
    - file: ../../wiremock-d365/stubs/fo_line_validation_error.json
when:
  - request: {method: POST, path: /receipts/1/post}
    expect: {status: 502, json: {detail: "{{contains:is on hold for all transactions}}"}}
then:
  db:
    receipts:
      rows: [{receipt_no: R-0104, status: post_failed, msd_voucher: null, post_error: "{{regex:^/data/CustomerPaymentJournalLines HTTP 400}}"}]
  db_unchanged: [invoices, allocations]
  mock_requests:
    - {method: POST, url_path: /data/CustomerPaymentJournalLines, count: 1}      # 4xx is not retried
    - {url_path_pattern: "/postJournal$", count: 0}
