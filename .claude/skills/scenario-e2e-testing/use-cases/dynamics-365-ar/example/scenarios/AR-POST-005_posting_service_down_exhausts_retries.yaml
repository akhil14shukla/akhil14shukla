id: AR-POST-005
title: Posting service returns 503 on every attempt; app stops after 3 attempts and records the failure
tags: [posting, msd, resilience]
clock: 2026-03-20T09:00:00Z
given:
  sql: [../fixtures/two_open_invoices_c001.sql]
  rows:
    receipts:
      - {id: 1, receipt_no: R-0105, customer_no: C001, currency: USD, amount: 1000, unapplied_amount: 0, received_on: 2026-03-19, status: matched}
    allocations:
      - {receipt_id: 1, invoice_id: 1, amount: 1000}
  mock_stubs:
    - file: ../../wiremock-d365/stubs/fo_post_service_unavailable.json
when:
  - request: {method: POST, path: /receipts/1/post}
    expect: {status: 502}
then:
  db:
    receipts: {rows: [{receipt_no: R-0105, status: post_failed, post_error: "{{contains:HTTP 503}}"}]}
  mock_requests:
    - {url_path_pattern: "/postJournal$", count: 3}
